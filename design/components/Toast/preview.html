<!doctype html>
<html lang="ko">
<head><meta charset="utf-8"><title>Toast</title>
<style>
/* 미리보기 배치만 — 값은 토큰 */
body { padding: var(--cl-space-4); }
.pv-row { display: flex; flex-wrap: wrap; align-items: center; gap: var(--cl-space-2); }
.pv-stack { display: flex; flex-direction: column; gap: var(--cl-space-4); }
.pv-label { margin: 0 0 var(--cl-space-2); font-size: var(--cl-fs-micro); font-weight: 600; color: var(--cl-ink-muted); }

</style></head>
<body class="cl-scope cl-ws-body">
<div class="pv-stack" style="align-items:flex-start">
<div class="cl-toast">메모를 저장했습니다</div><div class="cl-toast cl-toast--success">14명을 승인했습니다</div><div class="cl-toast cl-toast--danger">엑셀 파일을 읽지 못했습니다. 양식을 다시 받아 주세요</div></div>
</body>
</html>
