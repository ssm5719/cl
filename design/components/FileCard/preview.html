<!doctype html>
<html lang="ko">
<head><meta charset="utf-8"><title>FileCard</title>
<style>
/* 미리보기 배치만 — 값은 토큰 */
body { padding: var(--cl-space-4); }
.pv-stack { display: flex; flex-direction: column; gap: var(--cl-space-5); }
.pv-row { display: flex; flex-wrap: wrap; align-items: center; gap: var(--cl-space-3); }
.pv-label { margin: 0 0 var(--cl-space-2); font-size: var(--cl-fs-micro); font-weight: 600; color: var(--cl-ink-muted); }
.pv-box { max-width: 360px; border: 1px solid var(--cl-hairline); border-radius: var(--cl-radius-sm); background: var(--cl-canvas); }
</style></head>
<body class="cl-scope cl-pub-body">
<div class="pv-stack">
<div class="pv-box" style="max-width:520px;background:var(--cl-sidebar)"><div class="cl-filecard"><span class="cl-filecard__icon"><svg class="cl-icon" width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V7Z"></path><path d="M14 2v4a2 2 0 0 0 2 2h4"></path></svg><em class="cl-filecard__ext">HWP</em></span><p class="cl-filecard__name">수학수능기출26_해설.hwp</p><p class="cl-filecard__meta">한글 문서 · 2.4MB</p><div class="cl-filecard__actions"><a class="cl-btn cl-btn--primary" href="#"><svg class="cl-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path><path d="m7 10 5 5 5-5"></path><path d="M12 15V3"></path></svg>내려받기</a><a class="cl-btn cl-btn--ghost" href="#"><svg class="cl-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 3h6v6"></path><path d="M10 14 21 3"></path><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"></path></svg>새 창으로 열기</a></div></div></div>
</div>
</body>
</html>
