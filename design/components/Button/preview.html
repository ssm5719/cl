<!doctype html>
<html lang="ko">
<head><meta charset="utf-8"><title>Button</title>
<style>
/* 미리보기 배치만 — 값은 토큰 */
body { padding: var(--cl-space-4); }
.pv-row { display: flex; flex-wrap: wrap; align-items: center; gap: var(--cl-space-2); }
.pv-stack { display: flex; flex-direction: column; gap: var(--cl-space-4); }
.pv-label { margin: 0 0 var(--cl-space-2); font-size: var(--cl-fs-micro); font-weight: 600; color: var(--cl-ink-muted); }

</style></head>
<body class="cl-scope cl-ws-body">

<div class="pv-stack">
 <div><p class="pv-label">종류</p><div class="pv-row">
  <button class="cl-btn cl-btn--primary"><svg class="cl-icon" width="16" height="16" aria-hidden="true" fill="none" height="16" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.75" viewbox="0 0 24 24" width="16"><path d="M5 12h14"></path><path d="M12 5v14"></path></svg>선생님 생성</button>
  <button class="cl-btn cl-btn--tint"><svg class="cl-icon" width="16" height="16" aria-hidden="true" fill="none" height="16" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.75" viewbox="0 0 24 24" width="16"><path d="M5 12h14"></path><path d="M12 5v14"></path></svg>새로 만들기</button>
  <button class="cl-btn cl-btn--ghost">노출 순서</button>
  <button class="cl-btn cl-btn--ghost"><svg class="cl-icon" width="16" height="16" aria-hidden="true" fill="none" height="15" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.75" viewbox="0 0 24 24" width="15"><path d="M9 14 4 9l5-5"></path><path d="M4 9h10.5a5.5 5.5 0 0 1 5.5 5.5a5.5 5.5 0 0 1-5.5 5.5H11"></path></svg>새로고침</button>
  <button class="cl-btn cl-btn--text">초기화</button>
  <button class="cl-btn cl-btn--danger">삭제</button>
 </div></div>
 <div><p class="pv-label">크기 — xs 26 · sm 28 · 기본 32 · lg 44</p><div class="pv-row">
  <button class="cl-btn cl-btn--ghost cl-btn--xs">자료실</button>
  <button class="cl-btn cl-btn--primary cl-btn--sm"><svg class="cl-icon" width="14" height="14" aria-hidden="true" fill="none" height="16" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.75" viewbox="0 0 24 24" width="16"><path d="M5 12h14"></path><path d="M12 5v14"></path></svg>새로 만들기</button>
  <button class="cl-btn cl-btn--primary">강좌 생성</button>
  <button class="cl-btn cl-btn--primary cl-btn--lg">저장</button>
 </div></div>
 <div><p class="pv-label">상태 · 아이콘 버튼</p><div class="pv-row">
  <button class="cl-btn cl-btn--primary" disabled>저장</button>
  <button class="cl-btn cl-btn--ghost" aria-disabled="true">엑셀 다운로드</button>
  <button class="cl-icon-btn" aria-label="메뉴"><svg class="cl-icon" width="18" height="18" aria-hidden="true" fill="none" height="18" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.75" viewbox="0 0 24 24" width="18"><circle cx="12" cy="12" r="1"></circle><circle cx="19" cy="12" r="1"></circle><circle cx="5" cy="12" r="1"></circle></svg></button>
  <button class="cl-icon-btn" aria-label="알림"><svg class="cl-icon" width="18" height="18" aria-hidden="true" fill="none" height="18" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.75" viewbox="0 0 24 24" width="18"><path d="M6 8a6 6 0 0 1 12 0c0 7 3 9 3 9H3s3-2 3-9"></path><path d="M10.3 21a1.94 1.94 0 0 0 3.4 0"></path></svg></button>
 </div></div>
  <div><p class="pv-label">알약 · 되돌리기 — 수강신청 · 수강중(평소) · 수강중(올렸을 때)</p><div class="pv-row">
  <button class="cl-btn cl-btn--tint cl-btn--pill"><svg class="cl-icon" width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14"></path><path d="M12 5v14"></path></svg>수강신청</button>
  <button class="cl-btn cl-btn--undo cl-btn--pill"><span class="cl-btn__now"><svg class="cl-icon" width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 6 9 17l-5-5"></path></svg>수강중</span><span class="cl-btn__undo">수강 취소</span></button>
  <button class="cl-btn cl-btn--undo cl-btn--pill" style="color:var(--cl-danger);box-shadow:inset 0 0 0 1px currentColor;pointer-events:none"><span class="cl-btn__now" style="visibility:hidden">수강중</span><span class="cl-btn__undo" style="visibility:visible">수강 취소</span></button>
 </div></div>
</div>
</body>
</html>
